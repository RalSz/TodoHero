name: final_project
description: My 6ADET final project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # Lets you preview the app inside a phone frame while you develop in a
  # browser. It is switched off automatically in a release build.
  device_preview: ^1.3.1

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6

  intl: ^0.20.2
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
      - family: AlegreyaSans
        fonts:
          - asset: assets/fonts/Alegreya_Sans/AlegreyaSans-Thin.ttf
            weight: 100
          - asset: assets/fonts/Alegreya_Sans/AlegreyaSans-ThinItalic.ttf
            weight: 100
            style: italic
          - asset: assets/fonts/Alegreya_Sans/AlegreyaSans-Light.ttf
            weight: 300
          - asset: assets/fonts/Alegreya_Sans/AlegreyaSans-LightItalic.ttf
            weight: 300
            style: italic
          - asset: assets/fonts/Alegreya_Sans/AlegreyaSans-Regular.ttf
            weight: 400
          - asset: assets/fonts/Alegreya_Sans/AlegreyaSans-Italic.ttf
            weight: 400
            style: italic
          - asset: assets/fonts/Alegreya_Sans/AlegreyaSans-Medium.ttf
            weight: 500
          - asset: assets/fonts/Alegreya_Sans/AlegreyaSans-MediumItalic.ttf
            weight: 500
            style: italic
          - asset: assets/fonts/Alegreya_Sans/AlegreyaSans-Bold.ttf
            weight: 700
          - asset: assets/fonts/Alegreya_Sans/AlegreyaSans-BoldItalic.ttf
            weight: 700
            style: italic
          - asset: assets/fonts/Alegreya_Sans/AlegreyaSans-Bold.ttf
            weight: 800
          - asset: assets/fonts/Alegreya_Sans/AlegreyaSans-BoldItalic.ttf
            weight: 800
            style: italic
          - asset: assets/fonts/Alegreya_Sans/AlegreyaSans-Black.ttf
            weight: 900
          - asset: assets/fonts/Alegreya_Sans/AlegreyaSans-BlackItalic.ttf
            weight: 900
            style: italic
      - family: Alike
        fonts:
          - asset: assets/fonts/Alike/Alike-Regular.ttf
            weight: 400
